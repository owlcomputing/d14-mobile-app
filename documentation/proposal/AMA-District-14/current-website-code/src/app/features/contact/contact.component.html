<div class="min-h-screen bg-black bg-opacity-40 p-4 md:p-8 lg:p-12 text-white">
  <div
    class="max-w-[1400px] mx-auto bg-white bg-opacity-10 rounded-xl p-6 backdrop-blur-sm"
  >
    <!-- Contact Information Section -->
    <div class="space-y-12">
      <div>
        <h2 class="text-2xl font-bold mb-6 text-primary">
          District 14 Officers
        </h2>
        <div
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
        >
          <div
            *ngFor="let officer of officers"
            class="flex flex-col bg-black rounded-lg shadow-md transition duration-300 hover:shadow-lg"
          >
            <div class="bg-black p-4 rounded-t-lg flex-grow">
              <h3 class="text-2xl font-bold text-white">{{ officer.title }}</h3>
            </div>
            <div class="bg-white text-black p-4 rounded-b-lg">
              <p class="text-lg font-semibold text-black">{{ officer.name }}</p>
              <p *ngIf="officer.phone" class="text-sm">
                <a
                  href="tel:{{ officer.phone }}"
                  class="bg-black bg-opacity-0 text-black no-underline mb-1 hover:bg-opacity-10"
                >
                  <i class="fas fa-phone mr-2 text-black"></i
                  >{{ officer.phone | phoneFormat }}
                </a>
              </p>
              <p *ngIf="officer.email" class="text-sm">
                <a
                  href="mailto:{{ officer.email }}"
                  class="link bg-black bg-opacity-0 text-black no-underline mb-1 hover:bg-opacity-10"
                >
                  <i class="fas fa-envelope mr-2 text-black"></i
                  >{{ officer.email }}</a
                >
              </p>
              <p *ngIf="officer.address" class="text-sm text-black">
                <i class="fas fa-map-marker-alt mr-2 text-black"></i
                >{{ officer.address }}
              </p>
            </div>
          </div>
        </div>
      </div>

      <div>
        <h2 class="text-2xl font-bold mb-6 text-primary">Division Contacts</h2>
        <div
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
        >
          <div
            *ngFor="let contact of divisionContacts"
            class="flex flex-col bg-black rounded-lg shadow-md transition duration-300 hover:shadow-lg"
          >
            <div class="bg-black p-4 rounded-t-lg flex-grow">
              <h3 class="text-2xl font-bold text-white">{{ contact.title }}</h3>
            </div>
            <div class="bg-white text-black p-4 rounded-b-lg">
              <p class="text-lg font-semibold text-black">{{ contact.name }}</p>
              <p class="text-sm">
                <a
                  href="tel:{{ contact.phone }}"
                  class="bg-black bg-opacity-0 text-black no-underline mb-1 hover:bg-opacity-10"
                >
                  <i class="fas fa-phone mr-2 text-black"></i
                  >{{ contact.phone | phoneFormat }}</a
                >
              </p>
              <p class="text-sm">
                <a
                  href="mailto:{{ contact.email }}"
                  class="link bg-black bg-opacity-0 text-black no-underline mb-1 hover:bg-opacity-10"
                >
                  <i class="fas fa-envelope mr-2 text-black"></i
                  >{{ contact.email }}</a
                >
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form Section -->
      <div class="mb-12">
        <div
          class="bg-base-600 bg-opacity-30 border border-primary p-8 rounded-lg shadow-lg transition duration-300 hover:shadow-xl max-w-4xl mx-auto"
        >
          <h1 class="text-3xl font-bold mb-6 text-center text-primary">
            Contact Us
          </h1>
          <form (ngSubmit)="sendEmail()" class="space-y-4">
            <div>
              <label class="block mb-2 font-semibold" for="name">Name</label>
              <input
                type="text"
                id="name"
                [(ngModel)]="name"
                name="name"
                class="input input-bordered border-primary w-full"
                placeholder="Your Name"
                required
              />
            </div>

            <div>
              <label class="block mb-2 font-semibold" for="email">Email</label>
              <input
                type="email"
                id="email"
                [(ngModel)]="email"
                name="email"
                class="input input-bordered border-primary w-full"
                placeholder="Your Email"
                required
              />
            </div>

            <div>
              <label class="block mb-2 font-semibold" for="subject"
                >Subject</label
              >
              <input
                type="text"
                id="subject"
                [(ngModel)]="subject"
                name="subject"
                class="input input-bordered border-primary w-full"
                placeholder="Subject"
                required
              />
            </div>

            <div>
              <label class="block mb-2 font-semibold" for="message"
                >Message</label
              >
              <textarea
                id="message"
                [(ngModel)]="message"
                name="message"
                class="textarea textarea-bordered border-primary w-full h-32"
                placeholder="Your Message"
                required
              ></textarea>
            </div>

            <div class="text-center">
              <button
                type="submit"
                class="btn btn-primary w-full transition duration-300 transform hover:scale-105"
              >
                Send Message
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
